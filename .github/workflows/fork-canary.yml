# ============================================================================
# TEST HARNESS COPY -- this is NOT the real workflow.
#
# The real one lives in smithy-lang/smithy-rs PR #4773. This copy exists on
# vcjana/smithy-rs so the trust boundary can be exercised end-to-end before
# that PR merges (a `pull_request_target` workflow only runs from the BASE
# repo's default branch, so it can't be tested from a PR branch).
#
# Kept VERBATIM from the real workflow -- this is what's under test:
#   - the `pull_request_target` trigger and its `types: [labeled, synchronize]`
#   - `permissions: {}` at top level, per-job opt-in
#   - the `revoke-on-push` job, whole
#   - the `get-pr-info` job and its three-part `if:` guard, whole
#   - SHA-pinned checkout via `needs.get-pr-info.outputs.commit_sha`
#
# STUBBED (infrastructure only, no security logic):
#   - `runs-on: smithy_ubuntu-latest_8-core` -> `ubuntu-latest`
#     (the self-hosted label doesn't exist on a fork; jobs would queue forever)
#   - the `acquire-base-image` / `generate` / `canary` jobs are replaced by a
#     single `verify-sha-pinned-checkout` job that asserts the checkout landed
#     on the reviewed SHA. The real canary needs org secrets a fork can't read.
# ============================================================================
name: Fork canary
on:
  pull_request_target:
    types: [labeled, synchronize]

# One canary per PR; a new push supersedes an in-flight run for the same PR.
concurrency:
  group: fork-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default to no permissions; each job opts in to only what it needs.
permissions: {}

jobs:
  # A new push invalidates the maintainer's review, so drop the label and stop. Re-adding it after
  # re-reviewing the new commits is what re-triggers the canary. This runs with only `pull-requests:
  # write` and never checks out fork code, so it can't be subverted by the push it's reacting to.
  revoke-on-push:
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'safe-to-run-canary',
            });
            core.notice('New commits pushed; removed safe-to-run-canary. Re-add it after reviewing the new commits to run the canary again.');
          } catch (e) {
            // 404 just means the label wasn't set; anything else is non-fatal here.
            core.info(`no label to remove: ${e.message}`);
          }

  # Everything below runs only when a maintainer has labeled a fork PR. `head.repo.full_name`
  # excludes same-repo PRs (they already run the canary through ci-pr.yml).
  #
  # NOTE for the test: the repo name below is intentionally left as the real value. On this test
  # repo that means the third clause reads "head is not smithy-lang/smithy-rs", which any PR here
  # satisfies -- but the teammate's PR *is* from a fork, so the fork path is what gets exercised.
  get-pr-info:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'safe-to-run-canary' &&
      github.event.pull_request.head.repo.full_name != 'smithy-lang/smithy-rs'
    name: Get PR info
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      commit_sha: ${{ steps.get.outputs.result }}
    steps:
    - name: Resolve the reviewed head SHA
      id: get
      uses: actions/github-script@v7
      with:
        # Re-read the PR head SHA from the API rather than trusting a value derived from the event,
        # and pin every checkout below to it so the code that runs is the code that was reviewed.
        result-encoding: string
        script: |
          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
          });
          core.notice(`Reviewed head SHA resolved from the API: ${pr.data.head.sha}`);
          return pr.data.head.sha;

  # STUB: stands in for acquire-base-image / generate / canary. Those need the self-hosted runner
  # and org-owned canary secrets. What matters for the security review is that the checkout pins to
  # the SHA `get-pr-info` resolved, which is exactly what this asserts.
  verify-sha-pinned-checkout:
    name: Verify SHA-pinned checkout
    needs: get-pr-info
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        path: smithy-rs
        ref: ${{ needs.get-pr-info.outputs.commit_sha }}
    - name: Assert the checkout landed on the reviewed SHA
      env:
        EXPECTED: ${{ needs.get-pr-info.outputs.commit_sha }}
      run: |
        cd smithy-rs
        ACTUAL="$(git rev-parse HEAD)"
        echo "reviewed SHA (from API): ${EXPECTED}"
        echo "checked-out SHA:         ${ACTUAL}"
        if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "::error::checkout did NOT pin to the reviewed SHA"
          exit 1
        fi
        echo "::notice::PASS - checkout pinned to the reviewed SHA ${EXPECTED}"
    - name: Show what the untrusted diff actually changed
      run: |
        cd smithy-rs
        git log -1 --stat --format='%H%n%an%n%s'
